<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7aa2f7" stroke-opacity="0.06"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .glow { animation: drift 8s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(40px); } }
    </style>
  </defs>

  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <rect width="900" height="220" rx="16" fill="url(#grid)"/>
  <circle class="glow" cx="720" cy="40" r="140" fill="#bb9af7" fill-opacity="0.08"/>
  <circle class="glow" cx="640" cy="200" r="110" fill="#7aa2f7" fill-opacity="0.07"/>

  <!-- window dots -->
  <circle cx="34" cy="30" r="6" fill="#f7768e"/>
  <circle cx="54" cy="30" r="6" fill="#e0af68"/>
  <circle cx="74" cy="30" r="6" fill="#9ece6a"/>
  <text x="100" y="35" class="mono" font-size="13" fill="#565f89">~/jackh54 — zsh</text>

  <text x="40" y="96" class="sans" font-size="46" font-weight="800" fill="#c0caf5">Jack H</text>
  <rect x="40" y="110" width="120" height="4" rx="2" fill="url(#accent)"/>

  <text x="40" y="148" class="mono" font-size="16" fill="#7aa2f7">$ <tspan fill="#a9b1d6">full-stack dev · self-hoster · plugin maker</tspan><tspan class="cursor" fill="#bb9af7">▍</tspan></text>
  <text x="40" y="180" class="mono" font-size="13" fill="#565f89">Cloudflare Workers · Pterodactyl · Minecraft · iOS · Go</text>

  <!-- panda mark -->
  <g transform="translate(770 110)">
    <circle r="56" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.6"/>
    <text text-anchor="middle" y="14" class="mono" font-size="40" font-weight="700" fill="url(#accent)">{ }</text>
  </g>
</svg>
